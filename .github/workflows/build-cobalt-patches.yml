name: Build Cobalt patches

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android patches bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls patches/build/libs
          JAR=$(ls patches/build/libs/*.jar | grep -v -- '-sources\|-javadoc' | head -1)
          gh release create "v1.0.${{ github.run_number }}" "$JAR" \
            --title "Cobalt patches ${{ github.run_number }}" \
            --notes "Morphe patches + Cobalt download mode" --target "${{ github.sha }}"
